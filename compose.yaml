name: nodex-intercity

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: nodex
      POSTGRES_USER: nodex
      POSTGRES_PASSWORD: nodex
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodex -d nodex"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.4.0-alpine
    ports:
      - "${REDIS_HOST_PORT:-6387}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nodex
      MINIO_ROOT_PASSWORD: nodex-secret
    ports:
      - "${MINIO_API_HOST_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 nodex nodex-secret &&
      mc mb --ignore-existing local/nodex-local &&
      mc anonymous set none local/nodex-local"

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "11025:1025"
      - "18025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: node:24.13.1-alpine
    profiles: ["apps"]
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @nodex/api dev"
    env_file: .env.example
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: node:24.13.1-alpine
    profiles: ["apps"]
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @nodex/worker dev"
    env_file: .env.example
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
